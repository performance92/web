# HTTP -> HTTPS Yönlendirmesi (Port 80)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt / ACME doğrulama istekleri için açık alan (eğer kullanılırsa)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tüm HTTP trafiğini HTTPS'e yönlendir
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Sunucusu (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # Wildcard SSL Sertifika Yolları
    ssl_certificate /etc/nginx/ssl/certificate.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # Modern ve Güvenli TLS Yapılandırması
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Güvenlik Başlıkları
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Dosya ve Fotoğraf Yükleme Boyut Limiti (50 MB)
    client_max_body_size 50M;

    # Gzip Sıkıştırma (Hızlı yükleme için)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Node.js Web Uygulamasına Ters Proxy (Reverse Proxy)
    location / {
        proxy_pass http://insaat-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;

        # Zaman aşımı süreleri
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

